<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="omni-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="omni-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="omni-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Base -->
  <rect width="200" height="200" rx="44" fill="#0b0f19" />
  <rect width="198" height="198" x="1" y="1" rx="43" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Background Ambient Glow -->
  <circle cx="100" cy="100" r="50" fill="url(#omni-grad-1)" opacity="0.25" filter="url(#omni-glow)" />

  <!-- Outer Orbit Ring -->
  <ellipse cx="100" cy="100" rx="66" ry="28" transform="rotate(-30 100 100)" stroke="url(#omni-grad-1)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />
  
  <!-- Intersecting Counter Orbit Ring -->
  <ellipse cx="100" cy="100" rx="66" ry="28" transform="rotate(30 100 100)" stroke="url(#omni-grad-2)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Central Nexus Core -->
  <circle cx="100" cy="100" r="16" fill="url(#omni-grad-1)" />
  <circle cx="100" cy="100" r="8" fill="#ffffff" />

  <!-- Satellite Nodes -->
  <circle cx="152" cy="70" r="5.5" fill="#38bdf8" filter="url(#omni-glow)" />
  <circle cx="48" cy="130" r="5.5" fill="#818cf8" filter="url(#omni-glow)" />
  <circle cx="152" cy="130" r="4.5" fill="#a855f7" />
  <circle cx="48" cy="70" r="4.5" fill="#06b6d4" />
</svg>
